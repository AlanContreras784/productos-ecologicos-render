spring.application.name=productos_ecologicos


# ===============================================================
# SERVIDOR
# ===============================================================

# Puerto utilizado por la aplicación.
#
# En producción, Render proporciona la variable PORT.
# Si PORT no existe, se utiliza el puerto 8080.
server.port=${PORT:8080}


# ===============================================================
# URLS DE LA APLICACIÓN
# ===============================================================

# URL pública del backend.
#
# El valor real se obtiene de APP_BASE_URL.
#
# Ejemplo en producción:
# APP_BASE_URL=https://productos-ecologicos-render.onrender.com
app.base-url=${APP_BASE_URL}

# URL pública del frontend.
#
# El valor real se obtiene de FRONTEND_URL.
#
# Se utiliza principalmente para redirigir al usuario
# después de confirmar correctamente su dirección de email.
#
# Ejemplo durante desarrollo:
# FRONTEND_URL=http://127.0.0.1:5500
#
# Ejemplo en producción:
# FRONTEND_URL=https://tu-frontend.vercel.app
app.frontend-url=${FRONTEND_URL}


# ===============================================================
# VARIABLES DE ENTORNO
# ===============================================================

# Permite que Spring Boot cargue las variables definidas
# en el archivo .env cuando trabajamos en nuestro entorno local.
#
# En producción, por ejemplo en Render, las variables se configuran
# directamente desde Environment Variables y no es necesario
# subir el archivo .env al repositorio.
spring.config.import=optional:file:.env[.properties]


# ===============================================================
# CONFIGURACIÓN JWT
# ===============================================================

# Clave secreta utilizada para firmar y validar los tokens JWT.
#
# IMPORTANTE:
# El valor real NO está escrito en este archivo.
# Spring lo obtiene de la variable JWT_SECRET definida
# en .env o configurada como variable de entorno en producción.
jwt.secret=${JWT_SECRET}

# Tiempo de duración del token JWT.
#
# 86.400.000 milisegundos = 24 horas.
#
# Al estar fuera de JwtService.java podemos cambiar la duración
# sin modificar la lógica del servicio.
jwt.expiration=86400000


# ===============================================================
# CONEXIÓN A LA BASE DE DATOS MYSQL
# ===============================================================

# URL de conexión a MySQL.
#
# El valor se obtiene de DB_URL.
#
# LOCAL:
# DB_URL=jdbc:mysql://localhost:3306/productos_ecologicos
#
# PRODUCCIÓN:
# DB_URL contiene la URL de la base de datos alojada en TiDB Cloud.
spring.datasource.url=${DB_URL}

# Usuario de MySQL.
#
# LOCAL:
# DB_USERNAME=root
#
# PRODUCCIÓN:
# se utiliza el usuario proporcionado por TiDB Cloud.
spring.datasource.username=${DB_USERNAME}

# Contraseña de MySQL.
#
# LOCAL:
# puede quedar vacía si el MySQL de XAMPP no utiliza contraseña.
#
# PRODUCCIÓN:
# contiene la contraseña de la base de datos remota.
spring.datasource.password=${DB_PASSWORD}

# Driver JDBC utilizado para conectar Java con MySQL/TiDB.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================================================
# CONFIGURACIÓN DE JPA E HIBERNATE
# ===============================================================

# Indica qué debe hacer Hibernate con las tablas al iniciar
# la aplicación.
#
# update:
# - crea las tablas que no existen;
# - actualiza la estructura cuando es necesario;
# - conserva los datos existentes.
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las consultas SQL generadas por Hibernate.
#
# Es útil durante el desarrollo y las pruebas.
spring.jpa.show-sql=true

# Formatea las consultas SQL para facilitar su lectura
# en la consola.
spring.jpa.properties.hibernate.format_sql=true

# Dialecto utilizado por Hibernate para generar SQL compatible
# con MySQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ===============================================================
# OAUTH2 - GOOGLE
# ===============================================================

# Identificador de cliente de Google OAuth2.
#
# El valor real se obtiene de GOOGLE_CLIENT_ID.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

# Secreto de cliente de Google OAuth2.
#
# El valor real se obtiene de GOOGLE_CLIENT_SECRET.
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Permisos solicitados a Google.
#
# openid  → identificación del usuario.
# profile → información básica del perfil.
# email   → dirección de correo electrónico.
spring.security.oauth2.client.registration.google.scope=openid,profile,email


# ===============================================================
# DEBUG TEMPORAL - OAUTH2 / GOOGLE
# ===============================================================

# Muestra información detallada de Spring Security en la consola.
#
# Estos niveles son útiles durante las pruebas de OAuth2.
#
# Cuando el proyecto quede completamente estabilizado,
# estos niveles pueden reducirse para evitar exceso de información
# en los logs de producción.
logging.level.org.springframework.security=DEBUG

logging.level.org.springframework.security.oauth2=TRACE