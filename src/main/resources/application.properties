spring.application.name=productos_ecologicos

# Puerto para despliegue (Render)
server.port=${PORT:8080}

# URL base del backend
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Permite que Spring Boot cargue las variables definidas en el archivo .env
# cuando trabajamos en nuestro entorno local.
#
# En producción, por ejemplo en Render, las variables se configurarán
# directamente desde Environment Variables y no necesitaremos subir .env.
spring.config.import=optional:file:.env[.properties]

# ===============================================================
# CONFIGURACIÓN JWT
# ===============================================================

# Clave secreta utilizada para firmar y validar los tokens JWT.
#
# IMPORTANTE:
# El valor real NO está escrito en este archivo.
# Spring lo obtiene de la variable JWT_SECRET definida en .env
# o configurada como variable de entorno en producción.
jwt.secret=${JWT_SECRET}

# Tiempo de duración del token JWT.
#
# 86.400.000 milisegundos = 24 horas.
#
# Al estar fuera de JwtService.java podemos cambiar la duración
# sin modificar la lógica del servicio.
jwt.expiration=86400000

# ---------------------------------------------------------------
# Conexión a la base de datos MySQL (servidor de XAMPP)
# ---------------------------------------------------------------

# Dirección de la base de datos.
# jdbc:mysql:// → protocolo para conectarse a MySQL desde Java.
# localhost → el servidor está en nuestra propia máquina.
# 3306 → puerto por defecto de MySQL.
# productos_ecologicos → nombre de la base que creamos a mano antes de levantar la app.
# spring.datasource.url=jdbc:mysql://localhost:3306/productos_ecologicos

# # Usuario con el que entramos a MySQL. En XAMPP, por defecto es "root".
# spring.datasource.username=root

# # Contraseña del usuario. En XAMPP, root no tiene contraseña: queda vacía.
# spring.datasource.password=


# ===============================================================
# CONEXIÓN A LA BASE DE DATOS MYSQL
# ===============================================================

# URL de conexión a MySQL.
#
# El valor se obtiene de DB_URL.
#
# LOCAL:
# DB_URL=jdbc:mysql://localhost:3306/productos_ecologicos
#
# PRODUCCIÓN:
# DB_URL tendrá la URL de la base de datos alojada en la nube.
spring.datasource.url=${DB_URL}

# Usuario de MySQL.
#
# LOCAL:
# DB_USERNAME=root
#
# PRODUCCIÓN:
# se utilizará el usuario proporcionado por el servicio de base de datos.
spring.datasource.username=${DB_USERNAME}

# Contraseña de MySQL.
#
# LOCAL:
# puede quedar vacía si nuestro XAMPP no utiliza contraseña.
#
# PRODUCCIÓN:
# tendrá la contraseña de la base de datos remota.
spring.datasource.password=${DB_PASSWORD}

# Driver: el "traductor" que permite que Java hable con MySQL.
# Spring lo usa internamente para enviar y recibir datos de la base.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------
# Configuración de JPA e Hibernate
# ---------------------------------------------------------------

# Qué hace Hibernate con las tablas al arrancar la app.
# update → compara nuestras entidades con la base y crea o ajusta las
#          tablas si hace falta. Si la tabla no existe, la crea.
#          Nunca borra datos que ya estaban guardados.
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola el SQL que Hibernate genera por detrás.
# Sirve para ver qué está haciendo Spring sin que lo escribamos nosotros.
spring.jpa.show-sql=true

# Acomoda ese SQL de la consola con saltos de línea e indentación,
# para que sea más fácil de leer.
spring.jpa.properties.hibernate.format_sql=true

# Dialecto: le dice a Hibernate que genere SQL compatible con MySQL.
# Cada motor de base de datos (MySQL, PostgreSQL, etc.) tiene su variante.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================================================
# CONFIGURACIÓN DE CORREO ELECTRÓNICO - GMAIL
# ===============================================================

# Servidor SMTP de Gmail.
spring.mail.host=smtp.gmail.com

# Puerto utilizado por Gmail para SMTP con STARTTLS.
spring.mail.port=587

# Cuenta de Gmail utilizada para enviar los correos.
#
# El valor real se obtiene desde MAIL_USERNAME.
spring.mail.username=${MAIL_USERNAME}

# Contraseña de aplicación de Gmail.
#
# Nunca escribir la contraseña directamente en este archivo.
spring.mail.password=${MAIL_PASSWORD}

# Gmail requiere autenticación SMTP.
spring.mail.properties.mail.smtp.auth=true

# Habilita STARTTLS para cifrar la conexión.
spring.mail.properties.mail.smtp.starttls.enable=true

# Exige que STARTTLS esté disponible.
spring.mail.properties.mail.smtp.starttls.required=true


# ===============================================================
# TIMEOUTS SMTP
# ===============================================================

# Tiempo máximo para establecer la conexión con el servidor SMTP.
spring.mail.properties.mail.smtp.connectiontimeout=5000

# Tiempo máximo de espera para las operaciones SMTP.
spring.mail.properties.mail.smtp.timeout=5000

# Tiempo máximo para enviar los datos al servidor SMTP.
spring.mail.properties.mail.smtp.writetimeout=5000


# ===============================================================
# OAUTH2 - GOOGLE
# ===============================================================

# Identificador de cliente de Google OAuth2.
#
# El valor real se obtiene de GOOGLE_CLIENT_ID.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

# Secreto de cliente de Google OAuth2.
#
# El valor real se obtiene de GOOGLE_CLIENT_SECRET.
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Permisos solicitados a Google.
spring.security.oauth2.client.registration.google.scope=openid,profile,email


# ===============================================================
# DEBUG TEMPORAL PARA OAUTH2 / GOOGLE
# ===============================================================

# Muestra información detallada de Spring Security en la consola.
#
# Estos niveles son útiles durante las pruebas.
# Más adelante, antes de producción, podemos reducirlos.
logging.level.org.springframework.security=DEBUG

logging.level.org.springframework.security.oauth2=TRACE